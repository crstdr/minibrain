const N = new Map(DATA.nodes.map(n => [n.id, n]));
const CAT = {priority:["priority","Priority"],dec:["dec","Needs your decision"],gap:["gap","Missing or blocked"],idle:["idle","Paused or not started"],wip:["wip","Partly built or under way"],ok:["ok","Done or live"]};
const STATE = {"awaiting-user":"Needs your decision","missing":"Doesn't exist yet","built-off":"Built, switched off","partial":"Partly built","unknown":"State unknown","discussed":"Discussed only","specified":"Designed, not built","paused":"Paused","in-progress":"In progress","live":"Live","done":"Done","blocked":"Blocked","mapped":"Priority"};
function cat(n){ if(n.kind==="priority")return "priority"; if(["done","live"].includes(n.state))return "ok";

const up = id => closure(id, k => parents.get(k));

let loose=new Map(), view="all", sel=null, pos=new Map(), vis=new Set(), T={x:0,y:0,k:1}, size={w:0,h:0}, plan;

function layout(){
  vis = view==="all" ? new Set(N.keys()) : new Set([view, ...down(view)]);
  if(view!=="all") for(const i of [...vis]) for(const r of N.get(i).related) if(N.has(r) && N.get(r).kind!=="priority") vis.add(r);
  plan = schedule();
  if(plan.cycle) return 0;
  loose = new Map();
  for(const i of vis){ const n=N.get(i); if(n.kind==="priority" || parents.get(i).some(x=>vis.has(x))) continue;
    loose.set(i, [...vis].filter(x => N.get(x).related.includes(i))); }
  const kids = i => N.get(i).needs.concat([...loose].filter(([k,ps]) => ps.includes(i)).map(([k]) => k));

  let ch=true, guard=0;
  while(ch && guard++<200){ ch=false; for(const i of vis) for(const c of kids(i)) if(vis.has(c) && depth.get(c) < depth.get(i)+1){ depth.set(c, depth.get(i)+1); ch=true; } }
  for(const i of vis) if(N.get(i).kind!=="priority" && depth.get(i)===0) depth.set(i,1);

  for(let s=0;s<6;s++){
    for(let d=1;d<L.length;d++){ const b=new Map(L[d].map(i=>[i,bary(i,pars)])); L[d].sort((a,c)=>b.get(a)-b.get(c)); setIdx(); }
    for(let d=L.length-2;d>=1;d--){ const b=new Map(L[d].map(i=>[i,bary(i,kids)])); L[d].sort((a,c)=>b.get(a)-b.get(c)); setIdx(); }

  for(let d=1; d<L.length; d++){
    const want = L[d].map(i => { const p=pars(i).filter(x=>pos.has(x)); return p.length ? p.reduce((s,x)=>s+pos.get(x).y+pos.get(x).h/2,0)/p.length - H/2 : PAD; });

    L[d].forEach((i,k) => pos.set(i, {x:PAD+d*CX, y:ys[k], h:H}));

    e.textContent = d===0 ? "Priority" : d===cols-1 ? "Needed first" : d===1 ? "Depends on \u2192" : ""; world.appendChild(e); }
  for(const i of vis){ const n=N.get(i), p=pos.get(i), e=document.createElement("div");
    e.className="nd "+cat(n); e.dataset.id=i; e.style.left=p.x+"px"; e.style.top=p.y+"px"; e.title=n.title+": "+(STATE[n.state]||n.state);

}

  world.querySelectorAll(".nd").forEach(e => { const i=e.dataset.id; e.classList.toggle("sel", i===sel); e.classList.toggle("off", !!U && i!==sel && !U.has(i) && !D.has(i)); });
  svg.querySelectorAll("path").forEach(p => { const a=p.dataset.a, b=p.dataset.b, rel=p.dataset.rel; let c="";
    if(U){ if(rel) c = (a===sel||b===sel) ? "" : "off"; else if((a===sel||D.has(a)) && D.has(b)) c="down"; else if((b===sel||U.has(b)) && U.has(a)) c="up"; else c="off"; }
    p.setAttribute("class", (rel?"rel ":"")+c); });
  if(U) world.querySelectorAll(".nd.off").forEach(e => { const i=e.dataset.id; if(N.get(sel).related.includes(i) || N.get(i).related.includes(sel)) e.classList.remove("off"); });
  panel();
}
function apply(){ world.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.k})`; }
function fit(){ const r=stage.getBoundingClientRect(); const kw=r.width/size.w, kh=r.height/size.h;
  T.k = Math.min(1.2, Math.max(Math.min(kw,kh), 0.34)); T.x = Math.max(0,(r.width-size.w*T.k)/2); T.y = Math.max(0,(r.height-size.h*T.k)/2); apply(); }
function zoom(f, cx, cy){ const r=stage.getBoundingClientRect(); cx=cx??r.width/2; cy=cy??r.height/2; const k=Math.min(2.2,Math.max(0.15,T.k*f));
  T.x = cx-(cx-T.x)*k/T.k; T.y = cy-(cy-T.y)*k/T.k; T.k=k; apply(); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function li(ids){ return ids.filter(i=>N.has(i)).map(i => `<li data-go="${i}"><i style="background:var(--${cat(N.get(i))==="priority"?"pri":cat(N.get(i))})"></i>${esc(N.get(i).title)} <span style="color:var(--dim)">· ${esc(STATE[N.get(i).state]||N.get(i).state)}</span></li>`).join(""); }
function schedule(){
  // Work can proceed in parallel. Count only visible hard prerequisites.
  const before = new Map(), after = new Map(), next = new Map();
  const visiting = new Set();
  let cycle;
  const days = i => ["done","live"].includes(N.get(i).state) ? 0 : (N.get(i).daysLeft ?? 0);
  function longest(i, cache, adjacent, track){
    if(cache.has(i)) return cache.get(i);
    if(visiting.has(i)){
      const chain = [...visiting];
      cycle = chain.slice(chain.indexOf(i)).concat(i);
      return null;
    }
    visiting.add(i);
    let best = null;
    for(const j of adjacent(i)) if(vis.has(j)){
      const length = longest(j, cache, adjacent, track);
      if(cycle) return null;
      if(!best || length > best.length) best = {id:j, length};
    }
    visiting.delete(i);
    if(track && best) next.set(i, best.id);
    const length = days(i) + (best?.length ?? 0);
    cache.set(i, length);
    return length;
  }
  let start = null, total = 0;
  for(const i of vis){
    const length = longest(i, before, j => N.get(j).needs, true);
    if(cycle) return {cycle};
    if(length > total){ start=i; total=length; }
  }
  const path = [];
  for(let i=start; i; i=next.get(i)) if(N.get(i).kind!=="priority") path.unshift(i);
  return {total, path, slack: i => Math.max(0, total - (before.get(i) + longest(i, after, j => parents.get(j), false) - days(i)))};
}
function panel(){
  const P=document.getElementById("panel");
  if(plan.cycle){
    P.innerHTML = `<p role="alert"><strong>Dependency cycle:</strong> ${esc(plan.cycle.join(" → "))}. Fix the prerequisites in the source notes, then refresh this view.</p>`;
    return;
  }
  if(!sel){
    const ids=[...vis].filter(i=>N.get(i).kind!=="priority"), c=k=>ids.filter(i=>cat(N.get(i))===k).length;
    const decs=ids.filter(i=>cat(N.get(i))==="dec").map(i=>[i,[...up(i)].filter(x=>vis.has(x)).length]).sort((a,b)=>b[1]-a[1]);
    P.innerHTML = `<h2>${view==="all"?"The whole roadmap":esc(N.get(view).title)}</h2>
      <p>${view==="all"?"Priorities sit on the left. Solid lines point to prerequisites. Dashed lines indicate related work.":esc(N.get(view).body)}</p>
      <div class="stats"><div class="stat big"><b>${ids.length}</b><span>work items in this view</span></div>
      <div class="stat"><b style="color:var(--dec)">${c("dec")}</b><span>need your decision</span></div><div class="stat"><b style="color:var(--gap)">${c("gap")}</b><span>missing or blocked</span></div>
      <div class="stat"><b style="color:var(--idle)">${c("idle")}</b><span>paused or not started</span></div><div class="stat"><b style="color:var(--wip)">${c("wip")}</b><span>partly built or under way</span></div>
      <div class="stat"><b style="color:var(--ok)">${c("ok")}</b><span>done or live</span></div></div>
      <h3>Critical path: ${plan.total} workdays</h3>
      ${plan.path.length ? `<ul>${li(plan.path)}</ul>` : "<p>No remaining work estimated.</p>"}
      <p>Uses estimates and hard dependencies in this view. Excludes unestimated waits and assumes parallel work is possible.</p>
      <h3>Your decisions, most blocking first</h3><ul>${decs.map(([i,k])=>`<li data-go="${i}"><i style="background:var(--dec)"></i>${esc(N.get(i).title)} <span style="color:var(--dim)">· ${k} behind it</span></li>`).join("")}</ul>`;
  } else {
    const n=N.get(sel), k=cat(n), col=k==="priority"?"pri":k;
    P.innerHTML = `<span class="tag" style="border-color:var(--${col});color:var(--${col})">${esc(STATE[n.state]||n.state)}</span>
      <h2>${esc(n.title)}</h2>
      ${n.owner?`<div class="kv"><strong>Owner</strong> ${esc(n.owner)}</div>`:""}${n.serves?`<div class="kv"><strong>Serves</strong> ${esc(n.serves.split(",").map(s=>DATA.short[s.trim()]||s.trim()).join(", "))}</div>`:""}
      ${n.by?`<div class="kv"><strong>Reported by</strong> ${esc(n.by)}</div>`:""}${n.source?`<div class="kv"><strong>Source</strong> ${esc(n.source)}</div>`:""}
      <p>${esc(n.body)}</p>
      <div class="kv"><strong>Workdays left</strong> ${["done","live"].includes(n.state) ? 0 : (n.daysLeft ?? "Not estimated")}</div>
      <div class="kv"><strong>Slack</strong> ${Number(plan.slack(sel).toFixed(2))} workdays in this view</div>
      ${n.needs.length||n.ext.length?`<h3>Needs</h3><ul>${li(n.needs)}${n.ext.map(e=>`<li style="cursor:default"><i style="background:var(--dec)"></i>User action: ${esc(e)}</li>`).join("")}</ul>`:""}
      ${parents.get(sel).length?`<h3>Needed by</h3><ul>${li(parents.get(sel))}</ul>`:""}
      ${n.related.length?`<h3>Related, not a hard prerequisite</h3><ul>${li(n.related)}</ul>`:""}
      <h3>Reach</h3><div class="kv">${down(sel).size} items sit behind this one; ${up(sel).size} depend on it.</div>
      <p><button class="chip" id="clr">Clear selection</button></p>`;
  }
}
function pick(id){ if(id && !vis.has(id)){ view="all"; chips(); sel=id; draw(); return; } sel=id; mark(); }
function chips(){ const C=document.getElementById("chips"); C.innerHTML = [["all","All"],...DATA.order.map(o=>[o,DATA.short[o]])].map(([v,t])=>`<button class="chip" data-v="${v}" aria-pressed="${v===view}">${esc(t)}</button>`).join(""); }
document.getElementById("chips").addEventListener("click", e => { const b=e.target.closest("[data-v]"); if(!b)return; view=b.dataset.v; sel=null; chips(); draw(); });
document.getElementById("panel").addEventListener("click", e => { if(e.target.id==="clr") return pick(null); const l=e.target.closest("[data-go]"); if(l) pick(l.dataset.go); });
let drag=null, moved=false;
stage.addEventListener("pointerdown", e => { if(e.target.closest(".zoom"))return; drag={x:e.clientX-T.x,y:e.clientY-T.y}; moved=false; stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove", e => { if(!drag)return; const nx=e.clientX-drag.x, ny=e.clientY-drag.y; if(Math.abs(nx-T.x)+Math.abs(ny-T.y)>3){moved=true;stage.classList.add("drag");} T.x=nx;T.y=ny;apply(); });
stage.addEventListener("pointerup", e => { stage.classList.remove("drag"); const was=drag; drag=null; if(!was||moved)return;
  const el=document.elementFromPoint(e.clientX,e.clientY), nd=el&&el.closest(".nd"); if(el&&el.closest(".zoom"))return; pick(nd?(nd.dataset.id===sel?null:nd.dataset.id):null); });
stage.addEventListener("wheel", e => { e.preventDefault(); const r=stage.getBoundingClientRect(); zoom(Math.exp(-e.deltaY*0.0016), e.clientX-r.left, e.clientY-r.top); }, {passive:false});
document.getElementById("zi").onclick=()=>zoom(1.25); document.getElementById("zo").onclick=()=>zoom(0.8); document.getElementById("zf").onclick=fit;
addEventListener("resize", fit);
document.getElementById("sub").textContent = `Derived view generated ${DATA.generated}. The notes are the source.`;
document.getElementById("legend").innerHTML = Object.entries(CAT).map(([k,[c,t]])=>`<span><i class="sw" style="background:var(--${k==="priority"?"pri":k+"-bg"});border-color:var(--${k==="priority"?"pri":k});${k==="gap"?"border-style:dashed":""}"></i>${t}</span>`).join("") + `<span><svg width="30" height="10"><path d="M0,5 H30" stroke="currentColor" stroke-width="1.5"/></svg>needs</span><span><svg width="30" height="10"><path d="M0,5 H30" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 5"/></svg>related</span>`;
const [hv,hs]=location.hash.slice(1).split("/"); if(hv && (hv==="all"||DATA.order.includes(hv))) view=hv; if(hs && N.has(hs)) sel=hs;
chips(); draw();
</script>
</body>
